services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: multi_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d multi_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_NAME: ${DB_NAME:-multi_agent}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      # Optional override. If set, this takes precedence over DB_* in app config.
      DATABASE_URL: ${DATABASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.main"]

volumes:
  pgdata:
