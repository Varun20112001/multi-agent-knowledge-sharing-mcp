[project]
name = "multi-agent-knowledge-sharing-mcp"
version = "0.1.0"
description = "FastMCP + FastAPI backend for multi-agent RAG and memory with pgvector"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "alembic>=1.14.0",
  "mcp>=1.6.0",
  "openai>=1.58.0",
  "anthropic>=0.42.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.1",
  "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
